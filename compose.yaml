services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis:local
    container_name: jarvis
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8000"
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      JARVIS_LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      JARVIS_DATA_DIR: /data
    volumes:
      - ./data:/data
      # Required for the optional read-only Docker Engine synchronization.
      # DocOfHome issues GET requests only; socket access itself is privileged.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
