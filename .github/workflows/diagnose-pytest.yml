name: Diagnose Pytest

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - artifacts/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply effective phase patch
        run: python3 scripts/apply_162_phase_fix_v2.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Capture targeted and full Pytest output
        run: |
          mkdir -p artifacts
          (cd backend && python -m pytest -q \
            tests/test_effective_connection_phases.py \
            tests/test_effective_topology_service.py \
            tests/test_electrical_topology.py) > artifacts/pytest-targeted.txt 2>&1 || true
          (cd backend && python -m pytest -q) > artifacts/pytest-full.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name 'DocOfHome Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f artifacts/pytest-targeted.txt artifacts/pytest-full.txt
          git commit -m 'Add Pytest diagnostics [skip ci]' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
