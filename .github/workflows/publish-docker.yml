name: Publish Docker image
run-name: Publish Docker image ${{ github.event.release.tag_name || inputs.tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.7.4.6
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: scotty042/docofhome

jobs:
  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch revision <<< "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "patch_line=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "minor_line=$major.$minor" >> "$GITHUB_OUTPUT"
          echo "major_line=$major" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.patch_line }}
            type=raw,value=${{ steps.version.outputs.minor_line }}
            type=raw,value=${{ steps.version.outputs.major_line }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=DocOfHome
            org.opencontainers.image.description=Local digital twin for technical home documentation
            org.opencontainers.image.url=https://github.com/Scotty042/docofhome
            org.opencontainers.image.source=https://github.com/Scotty042/docofhome
            org.opencontainers.image.licenses=SEE-LICENSE-IN-REPOSITORY

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: mode=min
          sbom: true
