name: Publish Docker image
run-name: Publish Docker image ${{ github.event.release.tag_name || inputs.tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.6.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: scotty042/docofhome

jobs:
  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=DocOfHome
            org.opencontainers.image.description=Local digital twin for technical home documentation
            org.opencontainers.image.url=https://github.com/Scotty042/docofhome
            org.opencontainers.image.source=https://github.com/Scotty042/docofhome
            org.opencontainers.image.licenses=SEE-LICENSE-IN-REPOSITORY

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: mode=min
          sbom: true