name: Build corrected DocOfHome 1.6.2 v2

on:
  push:
    branches:
      - fix/1.6.2-effective-phases
    paths-ignore:
      - artifacts/**

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply phase calculation correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/app/services/electrical_topology.py')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    @staticmethod\n'
              r'    def _effective_connection_phases\(.*?\n'
              r'        return effective, warnings\n',
              re.DOTALL,
          )
          replacement = '''    @staticmethod
          def _effective_connection_phases(
              source: ElectricalEndpointProjection,
              target: ElectricalEndpointProjection,
              stored: list[ElectricalPhase],
          ) -> tuple[list[ElectricalPhase], list[str]]:
              line_phases = {
                  ElectricalPhase.L1,
                  ElectricalPhase.L2,
                  ElectricalPhase.L3,
              }
              order = {phase: index for index, phase in enumerate(ElectricalPhase)}
              warnings: list[str] = []

              requirements: list[tuple[ElectricalPhase, ...]] = []
              for endpoint in (source, target):
                  if (
                      endpoint.kind != ElectricalEndpointKind.PROTECTIVE_DEVICE
                      or endpoint.effective_phases is None
                  ):
                      continue
                  required = tuple(
                      phase for phase in endpoint.effective_phases if phase in line_phases
                  )
                  if required:
                      requirements.append(required)

              if requirements:
                  required = requirements[0]
                  if any(candidate != required for candidate in requirements[1:]):
                      details = " / ".join(
                          ", ".join(phase.value for phase in candidate)
                          for candidate in requirements
                      )
                      warnings.append(
                          "Beteiligte Schutzgeräte haben widersprüchliche wirksame Phasen: "
                          f"{details}."
                      )
                      required_lines = set.intersection(
                          *(set(candidate) for candidate in requirements)
                      )
                  else:
                      required_lines = set(required)

                  effective_set = (set(stored) - line_phases) | required_lines
                  for endpoint in (source, target):
                      if (
                          endpoint.kind == ElectricalEndpointKind.PROTECTIVE_DEVICE
                          or endpoint.effective_phases is None
                      ):
                          continue
                      endpoint_lines = set(endpoint.effective_phases) & line_phases
                      if endpoint_lines:
                          effective_set -= line_phases - endpoint_lines
                  effective = sorted(effective_set, key=order.__getitem__)
              else:
                  allowed = set(stored)
                  for endpoint in (source, target):
                      if endpoint.effective_phases is None:
                          continue
                      line_allowed = set(endpoint.effective_phases) & line_phases
                      if line_allowed:
                          allowed -= line_phases - line_allowed
                  effective = sorted(allowed, key=order.__getitem__)

              if effective != stored:
                  stored_names = ", ".join(item.value for item in stored) or "keine"
                  effective_names = ", ".join(item.value for item in effective) or "keine"
                  warnings.append(
                      "Gespeicherte Verbindung enthält abweichende Phasen: "
                      f"{stored_names}. Wirksam: {effective_names}."
                  )
              return effective, warnings
          '''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          ) + '\n'
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'Expected one backend function, replaced {count}')
          path.write_text(updated, encoding='utf-8')

          frontend = Path('frontend/src/pages/ElectricalTopologyPage.vue')
          source = frontend.read_text(encoding='utf-8')
          old = '''function displayPhases(connection: ElectricalConnection): ElectricalPhase[] {
            return connection.effective_phases.length ? connection.effective_phases : connection.phases
          }'''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''function displayPhases(connection: ElectricalConnection): ElectricalPhase[] {
            return connection.effective_phases
          }'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in source:
              raise SystemExit('Frontend fallback function not found')
          frontend.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Add regression tests
        run: |
          cat > backend/tests/test_effective_connection_phases.py <<'PY'
          from uuid import uuid4

          from app.repositories.electrical_topology import ElectricalEndpointProjection
          from app.schemas.electrical_topology import ElectricalEndpointKind, ElectricalPhase
          from app.services.electrical_topology import ElectricalTopologyService


          def endpoint(
              kind: ElectricalEndpointKind,
              phases: tuple[ElectricalPhase, ...] | None,
          ) -> ElectricalEndpointProjection:
              return ElectricalEndpointProjection(
                  kind=kind,
                  id=uuid4(),
                  name='Test',
                  code=None,
                  type_name='Test',
                  location_name=None,
                  device_type=None,
                  deleted_at=None,
                  effective_phases=phases,
              )


          def test_old_l1_is_replaced_by_calculated_l3_and_n_pe_remain() -> None:
              source = endpoint(
                  ElectricalEndpointKind.CABINET_COMPONENT,
                  (ElectricalPhase.L1, ElectricalPhase.L2, ElectricalPhase.L3),
              )
              target = endpoint(
                  ElectricalEndpointKind.PROTECTIVE_DEVICE,
                  (ElectricalPhase.L3,),
              )
              effective, warnings = ElectricalTopologyService._effective_connection_phases(
                  source,
                  target,
                  [ElectricalPhase.L1, ElectricalPhase.N, ElectricalPhase.PE],
              )
              assert effective == [ElectricalPhase.L3, ElectricalPhase.N, ElectricalPhase.PE]
              assert warnings == [
                  'Gespeicherte Verbindung enthält abweichende Phasen: '
                  'L1, N, PE. Wirksam: L3, N, PE.'
              ]


          def test_old_l3_is_replaced_by_calculated_l2() -> None:
              source = endpoint(
                  ElectricalEndpointKind.CABINET_COMPONENT,
                  (ElectricalPhase.L1, ElectricalPhase.L2, ElectricalPhase.L3),
              )
              target = endpoint(
                  ElectricalEndpointKind.PROTECTIVE_DEVICE,
                  (ElectricalPhase.L2,),
              )
              effective, warnings = ElectricalTopologyService._effective_connection_phases(
                  source,
                  target,
                  [ElectricalPhase.L3],
              )
              assert effective == [ElectricalPhase.L2]
              assert warnings
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Backend checks
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check app tests
          mypy app
          python -m pytest -q
          JARVIS_DATA_DIR="$RUNNER_TEMP/jarvis-data" alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build

      - name: Docker build
        run: docker build -t docofhome:1.6.2 .

      - name: Package corrected release
        run: |
          rm -rf frontend/node_modules frontend/dist
          find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache \) -prune -exec rm -rf {} +
          rm -f .github/workflows/build-162-effective-phase.yml
          rm -f .github/workflows/build-162-effective-phase-v2.yml
          rm -f backend/tests/test_effective_connection_phases.py
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          excluded = {'.git', 'artifacts', 'node_modules', 'dist', '__pycache__', '.pytest_cache', '.mypy_cache', '.ruff_cache'}
          files = sorted(
              path for path in Path('.').rglob('*')
              if path.is_file() and not any(part in excluded for part in path.parts)
          )
          lines = [
              '# DocOfHome 1.6.2 – Release-Manifest',
              '# Format: SHA256  SIZE_BYTES  PATH',
              f'# Dateien: {len(files)}',
          ]
          for path in files:
              data = path.read_bytes()
              lines.append(f'{hashlib.sha256(data).hexdigest()}  {len(data)}  {path.as_posix()}')
          Path('artifacts/DocOfHome-1.6.2-MANIFEST.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('artifacts/DocOfHome-1.6.2-VALIDATION.md').write_text(
              '# DocOfHome 1.6.2 – Validierungsbericht\n\n'
              '- Alte gespeicherte L1/L2/L3-Werte werden bei Schutzgeräten durch die aus der Schiene berechnete Phase ersetzt.\n'
              '- N und PE bleiben erhalten.\n'
              '- Kein Frontend-Rückfall auf alte gespeicherte Außenleiterphasen.\n'
              '- Ruff, mypy, vollständige Pytest-Suite und Alembic erfolgreich.\n'
              '- npm test und npm run build erfolgreich.\n'
              '- Docker-Build erfolgreich.\n',
              encoding='utf-8',
          )
          PY
          zip -q -r "$RUNNER_TEMP/DocOfHome-1.6.2.zip" . \
            -x '.git/*' 'artifacts/*' 'frontend/node_modules/*' 'frontend/dist/*' \
               '*/__pycache__/*' '*/.pytest_cache/*' '*/.mypy_cache/*' '*/.ruff_cache/*'
          cp "$RUNNER_TEMP/DocOfHome-1.6.2.zip" artifacts/DocOfHome-1.6.2.zip
          sha256sum artifacts/DocOfHome-1.6.2.zip > artifacts/DocOfHome-1.6.2.zip.sha256
          unzip -tq artifacts/DocOfHome-1.6.2.zip

      - name: Publish package to build branch
        run: |
          git config user.name 'DocOfHome Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f artifacts/DocOfHome-1.6.2.zip \
            artifacts/DocOfHome-1.6.2.zip.sha256 \
            artifacts/DocOfHome-1.6.2-MANIFEST.txt \
            artifacts/DocOfHome-1.6.2-VALIDATION.md
          git commit -m 'Add corrected DocOfHome 1.6.2 package [skip ci]'
          git push
