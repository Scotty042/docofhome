name: Diagnose Ruff

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - artifacts/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - working-directory: backend
        run: pip install ruff
      - name: Capture Ruff output
        run: |
          mkdir -p artifacts
          (cd backend && ruff check app tests) > artifacts/ruff.txt 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name 'DocOfHome Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f artifacts/ruff.txt
          git commit -m 'Add Ruff diagnostic [skip ci]' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
