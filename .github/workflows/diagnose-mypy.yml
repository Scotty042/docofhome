name: Diagnose Mypy

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - artifacts/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Capture mypy output
        run: |
          mkdir -p artifacts
          (cd backend && mypy app/api/v1/electrical_topology.py app/services/electrical_topology_effective.py) > artifacts/mypy.txt 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name 'DocOfHome Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f artifacts/mypy.txt
          git commit -m 'Add mypy diagnostic [skip ci]' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
